<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODOアプリ</title>
    <link rel="stylesheet" href="/src/To-Do/todo.css">
    <script src="/src/To-Do/todo.ts"></script>
</head>
<body>
    <div class="container">
        <h1>📝 TODOリスト</h1>

        <div class="input-section">
            <input type="text" id="todoInput" placeholder="新しいTODOを入力..." autocomplete="off">
            <select id="prioritySelect">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
            </select>
            <button id="add-Button">追加</button>
            <button id="back-Button">戻る</button>
        </div>

        <ul id="todoList">
            <li class="empty-state">TODOを追加してください</li>
        </ul>
    </div>

</body>
</html>
